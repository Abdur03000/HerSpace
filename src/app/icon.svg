<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HerSpace">
  <!--
    Real geometry rather than an emoji <text> element. Browsers often cannot
    render text inside a favicon because the document has no font access at
    that size, so the SVG painted nothing and the tab showed a default globe.
    Kept in sync with favicon.ico.
  -->
  <g fill="#ec4899">
    <ellipse cx="16" cy="8.48" rx="6.88" ry="12.8"/>
    <ellipse cx="16" cy="8.48" rx="6.88" ry="12.8" transform="rotate(-72 16 16)"/>
    <ellipse cx="16" cy="8.48" rx="6.88" ry="12.8" transform="rotate(-144 16 16)"/>
    <ellipse cx="16" cy="8.48" rx="6.88" ry="12.8" transform="rotate(-216 16 16)"/>
    <ellipse cx="16" cy="8.48" rx="6.88" ry="12.8" transform="rotate(-288 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="3.68" fill="#a855f7"/>
  <circle cx="16" cy="16" r="1.44" fill="#fde6f8"/>
</svg>